# Smart Coder Switch 示例配置
#
# 快速开始：
# 1. 复制本文件为 config.yaml
# 2. 修改 upstream.base-url 和 models.smart-coder 中的模型名
# 3. 启动 smart-coder-switch

# HTTP 服务监听配置。
listen:
  # 只允许本机访问；需要远程访问时再改为 0.0.0.0:18082，
  # 并配合防火墙或反向代理增加认证。
  address: 127.0.0.1:18082

# OpenAI 兼容上游配置。
upstream:
  # CLIProxyAPI 的兼容 API 地址示例。
  # 也可以直接填写其他 OpenAI 兼容 Provider 地址。
  base-url: http://127.0.0.1:8317/

  # 上游请求超时（秒）。0 或省略表示不超时；不影响已建立的流式响应。
  timeout: 300

# 逻辑模型映射。
#
# 推荐示例：
# - LOW：deepseek，处理日常任务
# - MEDIUM / HIGH：gpt，处理需要更强能力的阶段
# - DIRECT：claude，新任务入口先由强模型判断方向
models:
  smart-coder:
    low-model: deepseek-v4-flash
    medium-model: gpt-5.6-terra
    high-model: gpt-5.6-terra
    direct-model: claude-sonnet-4-6

    # 概率路由默认关闭，便于复现和理解路由结果。
    # 取值范围 [0, 1]；两者之和不能超过 1。
    medium-probability: 0
    high-probability: 0

    # 固定轮次路由（可选）。assistant 消息数能被对应值整除时触发。
    # HIGH 固定轮次优先于 MEDIUM 固定轮次。
    high-rounds: 25
    medium-rounds: 50

    # DIRECT 命中时默认注入首轮说明 Prompt。
    # 显式设为 false 可关闭，仅保留模型切换。
    direct-prompt-enabled: true

    # 当最新 assistant 消息包含【Review】或【Plan】标记时，
    # 是否追加防复述指令。默认关闭。
    anti-repetition-prompt-enabled: false

    # DIRECT 请求包含图片时，是否注入图片理解提示。
    # 默认开启，用于让后续不支持图片的模型继续处理。
    image-prompt-enabled: true

# 日志配置。
log:
  # 未设置时只输出到标准错误；设置后同时输出到文件和标准错误。
  file: ./log/smart-coder-switch.log
  # 可选值：debug、info、warn、error。
  level: info

# 原始请求和路由决策 Trace（始终启用）。
trace:
  # 最多保留的 Trace 条数。
  max-records: 100
  # 单个请求允许保存的最大字节数。
  max-body-size: 20971520
  # Trace 保存目录。
  directory: ./log/traces

# 决策日志 SQLite 数据库（用于 Web 控制台）。
sqlite:
  # 数据库文件路径；父目录会自动创建。
  path: ./data/decisions.db
  # 最多保留的决策记录条数，超过后清理最旧记录。
  max-records: 1000

# 系统注入消息过滤前缀（可选）。
#
# 当最后一条用户消息以任一前缀开头时，不触发 direct-model 的 DIRECT 路由。
# 未配置时使用下面两个默认前缀；配置为空列表 [] 表示关闭过滤。
# ignored-user-input-prefixes:
#   - <system-reminder>
#   - '[Compressed conversation section]'